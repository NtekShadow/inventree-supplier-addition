name: CI Checks

on: ["push", "pull_request"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Deps
        run: |
          pip install -U ruff pytest
          pip install -U wheel setuptools twine build
          pip install -e .
      - name: Style Checks
        run: |
          ruff check
      - name: Run Tests
        run: |
          pytest
      - name: Build Plugin
        run: |
          python -m build
