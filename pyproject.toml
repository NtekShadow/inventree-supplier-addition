# Configuration file for tools (ruff, etc.)
# Packaging is handled by setup.py to avoid isolated build dependencies
# in restricted InvenTree container environments and to dynamically support
# both inventree-supplier-addition and inventree-supplier-integration package names.

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src = ["inventree_supplier_addition"]

[tool.ruff.lint]
ignore = [
    "I001",
    "PIE790",
    "RUF012",
]
